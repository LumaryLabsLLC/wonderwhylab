<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 600; src: url('../../node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fredoka'; font-weight: 700; src: url('../../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Lexend'; font-weight: 100 900; src: url('../../node_modules/@fontsource-variable/lexend/files/lexend-latin-wght-normal.woff2') format('woff2'); }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    font-family: 'Lexend', sans-serif; color: #1e2b4a;
    background:
      radial-gradient(circle at 8% 10%, #fff1b0 0, transparent 38%),
      radial-gradient(circle at 92% 92%, #c9f2da 0, transparent 40%),
      radial-gradient(circle at 70% 0%, #ffd9e6 0, transparent 35%),
      #eef5ff;
  }
  /* soft graph-paper texture */
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(59,140,255,.07) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(59,140,255,.07) 1.5px, transparent 1.5px);
    background-size: 40px 40px;
  }

  .doodle { position: absolute; }

  .left { position: absolute; left: 64px; top: 54px; width: 540px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 104px; height: 104px; filter: drop-shadow(0 5px 0 rgba(30,43,74,.18)); }
  .title { font-family: 'Fredoka'; font-weight: 700; font-size: 74px; line-height: .95; letter-spacing: .5px; }
  .title .w span { display: inline-block; -webkit-text-stroke: 2.5px #1e2b4a; paint-order: stroke fill; text-shadow: 0 5px 0 #1e2b4a; }
  .title .w span:nth-child(2n) { transform: translateY(-3px) rotate(5deg); }
  .title .w span:nth-child(2n+1) { transform: rotate(-5deg); }
  .title .rest { display: block; margin-top: 6px; }

  .pitch { margin: 30px 0 0; font-family: 'Fredoka'; font-weight: 600; font-size: 39px; line-height: 1.12; }
  .pitch em { font-style: normal; background: linear-gradient(transparent 60%, #ffd23f 60%); padding: 0 4px; }
  .sub { margin: 12px 0 0; font-size: 22px; color: #3b4766; font-weight: 500; white-space: nowrap; }

  .chips { display: flex; flex-wrap: wrap; gap: 12px 10px; margin-top: 22px; max-width: 540px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px 8px 12px; border-radius: 99px; border: 3px solid #1e2b4a; box-shadow: 0 4px 0 #1e2b4a; font-family: 'Fredoka'; font-weight: 700; font-size: 21px; white-space: nowrap; }
  .chip .e { font-size: 21px; }

  .url { position: absolute; left: 64px; bottom: 40px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 22px; border-radius: 99px; background: #1e2b4a; color: white; font-family: 'Fredoka'; font-weight: 600; font-size: 26px; letter-spacing: .3px; }
  .url i { width: 12px; height: 12px; border-radius: 50%; background: #34c47c; display: inline-block; }

  .shot { position: absolute; border: 4px solid #1e2b4a; border-radius: 22px; overflow: hidden; background: white; box-shadow: 0 10px 0 #1e2b4a, 0 30px 50px -20px rgba(30,43,74,.5); }
  .shot img { display: block; width: 100%; }
  .shot.a { width: 520px; right: -28px; top: 128px; transform: rotate(4deg); }
  .shot.b { width: 290px; right: 318px; top: 378px; transform: rotate(-6deg); z-index: 2; }

  .burst { position: absolute; right: 30px; top: 10px; width: 200px; height: 200px; z-index: 3; transform: rotate(10deg); }
  .burst span { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: 'Fredoka'; font-weight: 700; font-size: 36px; line-height: 1; color: #1e2b4a; }
  .burst small { display: block; font-size: 18px; font-weight: 600; margin-top: 3px; }
</style>
</head>
<body>

      </svg>
      <div class="title">
        <span class="w"><span style="color:#ff6b5b">W</span><span style="color:#ff9f43">o</span><span style="color:#e0b11a">n</span><span style="color:#34c47c">d</span><span style="color:#3b8cff">e</span><span style="color:#8b5cf6">r</span></span>
